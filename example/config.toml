# Example iplayerDL config.toml.
#
# Copy to $XDG_CONFIG_HOME/iplayerdl/config.toml (normally
# ~/.config/iplayerdl/config.toml), or point IPLAYERDL_CONFIG at it.
# Everything omitted here falls back to built-in defaults (see the
# auto-generated template for the full commented reference).
#
# The download queue is a sqlite database next to this file (queue.db,
# overridable with $IPLAYERDL_DB). Add URLs with `iplayerdl queue add
# <url> ...` or paste them into the web UI; they are kept after the run
# so the queue history stays visible.
#
# Secrets do NOT belong here — put them in iplayerdl.env (see
# example/iplayerdl.env) and load it via your service manager
# (e.g. the NixOS module's environmentFile), or fill in [environment].

[folders]
download_dir = "/tmp/iplayerdl/download"
media_dir = "/var/lib/iplayerdl"
transcode_dir = "/tmp/iplayerdl/transcode"

[pipeline]
transcode = true
delete_downloads = true
max_non_transcoded = 5
allow_speculative_adds = false

[download_settings]
format = "bv*+ba[language=en]/bv*+ba/best"
subtitleslangs = ["en.*"]
writesubtitles = true
quiet = true
noprogress = false
check_formats = false
ignoreerrors = "only_download"

[transcode_settings]
# one of "none" (libsvtav1/AV1 CPU), "qsv", "vaapi", "apple"
encoder = "none"
quality = 20
device = "/dev/dri/renderD128"
crop = true

[ntfy]
url_base = "https://ntfy.example.com/"
topic = "iplayerDL"

[web]
host = "127.0.0.1"
port = 8080

[logging]
# one of auto, DEBUG, INFO, WARNING, ERROR, CRITICAL
level = "auto"
