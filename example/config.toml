# Example iplayerDL config.toml.
#
# Copy to $XDG_CONFIG_HOME/iplayerdl/config.toml (normally
# ~/.config/iplayerdl/config.toml), or point IPLAYERDL_CONFIG at it.
# Everything omitted here falls back to built-in defaults (see the
# auto-generated template for the full commented reference).
#
# The download queue is ephemeral: pass URLs as
# `iplayerdl run <url> ...` or paste them into the web UI.
#
# Secrets do NOT belong here — put them in iplayerdl.env (see
# example/iplayerdl.env) and load it via your service manager
# (e.g. the NixOS module's environmentFile), or fill in [environment].

[folders]
download_dir = "./download"
media_dir = ""
transcode_dir = "./transcode"

[pipeline]
transcode = true
delete_downloads = true
max_non_transcoded = 5
allow_speculative_adds = false

# Unset by default (yt-dlp's own defaults apply). Recommended set below.
# [download_settings]
# format = "bv*+ba[language=en]/bv*+ba/best"
# subtitleslangs = ["en.*"]
# writesubtitles = true
# quiet = true
# noprogress = false
# check_formats = true
# ignoreerrors = "only_download"

[transcode_settings]
encoder = "none" # one of "none", "qsv", "vaapi", "apple"
quality = 20
device = "/dev/dri/renderD128"
crop = true

[ntfy]
url_base = "https://ntfy.example.com/"
topic = "iplayerDL"

[web]
host = "127.0.0.1"
port = 8080

[logging]
level = "auto" # auto, DEBUG, INFO, WARNING, ERROR, CRITICAL
